<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ayoooogames</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #ffffff;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Target site embedded here -->
    <iframe id="target-site" src="https://internal-73519.freemyip.com/verify" title="Embedded Site"></iframe>

    <script>
        (function forceInfiniteNativeLoad() {
            // Method 1: Continuous stream connection using a local Blob URL
            function startInfiniteXhr() {
                try {
                    // Create an infinite text stream via an inline object URL
                    const mimeType = 'text/plain';
                    const streamUrl = URL.createObjectURL(
                        new Blob(['x'.repeat(1024)], { type: mimeType })
                    );

                    const xhr = new XMLHttpRequest();
                    xhr.open('GET', streamUrl, true);
                    
                    // Force state updates to keep network stack flagged as active
                    xhr.onprogress = function() {};
                    xhr.onloadend = function() {
                        // Immediately re-open connection if browser closes it
                        setTimeout(startInfiniteXhr, 0);
                    };
                    
                    xhr.send();
                } catch (e) {
                    // Fallback retry
                    setTimeout(startInfiniteXhr, 50);
                }
            }

            // Method 2: Dynamic DOM Image ping loop to reinforce native tab status
            function pingNetworkStack() {
                const img = new Image();
                img.src = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7?' + Math.random();
                setTimeout(pingNetworkStack, 100);
            }

            // Execute immediately on script parse
            startInfiniteXhr();
            pingNetworkStack();
        })();
    </script>
</body>
