<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UnblockedSeth</title>
    <style>
        html, body { 
            width: 100%; 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: #000; 
        }
        iframe { 
            display: block; 
            width: 100vw; 
            height: 100vh; 
            border: 0; 
            margin: 0; 
            padding: 0; 
        }
    </style>
</head>
<body>

    <!-- 
      THE UNBREAKABLE EMBED:
      - Uses "allow-same-origin" and "allow-scripts" so the game framework runs.
      - Intentionally removes "allow-top-navigation" to block fundamental iframe escape actions.
    -->
    <iframe 
        id="game-frame"
        src="https://numbercraftacademy.com" 
        title="UnblockedSeth" 
        allow="fullscreen; clipboard-read; clipboard-write; gamepad" 
        allowfullscreen 
        sandbox="allow-scripts allow-forms allow-popups allow-modals allow-downloads allow-pointer-lock allow-presentation allow-same-origin" 
        referrerpolicy="no-referrer"
    ></iframe>

    <script>
        // TRAP SHIELD: Prevents any background framework from changing your parent domain window
        var preventNavigation = 0;
        window.onbeforeunload = function() {
            if (preventNavigation > 0) {
                preventNavigation--;
                return "Navigation blocked by shield.";
            }
        };

        // Continually intercept history and navigation events fired by malicious tracking arrays
        setInterval(function() {
            preventNavigation++;
            if (window.location.hash !== '#protected') {
                window.location.hash = '#protected';
            }
        }, 100);

        // Fail-safe override: If an extension breaks the sandbox structure, freeze the parent framework execution
        window.addEventListener('unload', function(event) {
            window.location.replace(window.location.href);
        });
    </script>

</body>
</html>
