<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded Secure Viewer</title>
    
    <!-- Meta CSP: Blocks all parent-level scripts. Stops AI extensions from injecting redirects here. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; frame-src *; style-src 'unsafe-inline';">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <!-- 
      Sandbox attributes intentionally MISSING to ensure security:
      - allow-popups (blocks new tabs/windows)
      - allow-top-navigation (blocks redirecting the current parent tab)
      - allow-top-navigation-by-user-activation
    -->
    <iframe 
        src="https://example.com" 
        allowfullscreen 
        sandbox="allow-scripts allow-same-origin allow-forms"
        title="Full Screen Embed">
    </iframe>
</body>
</html>
