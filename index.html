<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AYOGAMES</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0f172a;
        }

        /* Fullscreen Embedded Website */
        .site-container {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Permanent Infinite Loading Overlay */
        .loader-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            background: rgba(15, 23, 42, 0.85); /* Dark semi-transparent background */
            backdrop-filter: blur(8px);          /* Blurs the underlying site */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #f8fafc;

            /* 
              Uncomment the line below if you want users to be able to click 
              and interact with the website while the spinner is active:
            */
            /* pointer-events: none; */
        }

        /* Spinner Animation */
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.15);
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            animation: spin 0.9s cubic-bezier(0.6, 0.2, 0.4, 0.8) infinite;
            margin-bottom: 18px;
        }

        @keyframes spin {
            0%   { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-text {
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: 0.03em;
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <!-- Replace the src URL with the website you want to embed -->
    <iframe 
        class="site-container" 
        src="https://homeworkhelp.asturkiters.es/" 
        title="Embedded Content">
    </iframe>

    <!-- Infinite Loader Overlay -->
    <div class="loader-overlay">
        <div class="spinner"></div>
        <div class="loader-text">Loading page...</div>
    </div>

</body>
</html>
