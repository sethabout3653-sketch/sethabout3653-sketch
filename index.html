<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<style>
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #fff;
}

iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: #fff;
}
</style>
</head>
<body>
    <iframe
        id="frame"
        src="https://behind.cryptparty.com/"
        sandbox="allow-forms allow-scripts allow-same-origin allow-pointer-lock allow-downloads"
        allow="fullscreen; autoplay; clipboard-read; clipboard-write"
        allowfullscreen
        referrerpolicy="no-referrer">
    </iframe>
</body>
</html>
