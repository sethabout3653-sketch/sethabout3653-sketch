<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        http-equiv="Content-Security-Policy"
        content="default-src 'self'; frame-src https:; object-src 'none'; base-uri 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';"
    >

    <meta
        http-equiv="X-Content-Type-Options"
        content="nosniff"
    >

    <meta
        http-equiv="Referrer-Policy"
        content="no-referrer"
    >

    <title>ayoGAMES</title>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }

        body {
            position: fixed;
            inset: 0;
        }

        #embed {
            position: fixed;
            inset: 0;

            width: 100vw;
            height: 100vh;

            width: 100dvw;
            height: 100dvh;

            display: block;

            margin: 0;
            padding: 0;

            border: 0;
            outline: 0;

            background: #000;
        }
    </style>
</head>

<body>

    <iframe
        id="embed"
        src="https://nirbytesovercloaked-zafo.numbercraftacademy.com"
        title="Embedded Website"

        sandbox="
            allow-downloads
            allow-forms
            allow-modals
            allow-orientation-lock
            allow-pointer-lock
            allow-presentation
            allow-scripts
            allow-storage-access-by-user-activation
        "

        allow="
            autoplay;
            fullscreen;
            picture-in-picture;
            encrypted-media;
            clipboard-read;
            clipboard-write
        "

        allowfullscreen
        referrerpolicy="no-referrer"
    ></iframe>

    <script>
        "use strict";

        const iframe = document.getElementById("embed");

        const TRUSTED_URL = "https://example.com/";

        iframe.src = TRUSTED_URL;

        /*
         * Keep the iframe element itself pointed at the configured URL.
         */
        const observer = new MutationObserver(() => {
            if (iframe.getAttribute("src") !== TRUSTED_URL) {
                iframe.setAttribute("src", TRUSTED_URL);
            }
        });

        observer.observe(iframe, {
            attributes: true,
            attributeFilter: ["src"]
        });

        /*
         * Keep the iframe exactly fullscreen.
         */
        function resizeIframe() {
            iframe.style.width = `${window.innerWidth}px`;
            iframe.style.height = `${window.innerHeight}px`;
        }

        window.addEventListener("resize", resizeIframe);
        window.addEventListener("orientationchange", resizeIframe);

        resizeIframe();

        /*
         * Restore the configured URL if the iframe itself reports an error.
         */
        iframe.addEventListener("error", () => {
            iframe.src = TRUSTED_URL;
        });
    </script>

</body>
</html>
