<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        http-equiv="X-Content-Type-Options"
        content="nosniff"
    >

    <meta
        http-equiv="Referrer-Policy"
        content="no-referrer"
    >

    <title>unblockedgames</title>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }

        body {
            position: fixed;
            inset: 0;
        }

        #embed {
            position: fixed;
            inset: 0;

            width: 100vw;
            height: 100vh;

            width: 100dvw;
            height: 100dvh;

            display: block;

            margin: 0;
            padding: 0;

            border: 0;
            outline: 0;

            background: #000;
        }
    </style>
</head>

<body>

    <iframe
        id="embed"
        src="https://example.com/"
        title="Embedded Website"
        sandbox="allow-forms allow-scripts allow-modals allow-presentation allow-orientation-lock"
        referrerpolicy="no-referrer"
    ></iframe>

    <script>
        "use strict";

        const iframe = document.getElementById("embed");

        const TRUSTED_URL = "https://slnt.frenchchurch.org/";

        iframe.src = TRUSTED_URL;

        /*
         * Keep the iframe itself fullscreen.
         */
        function resizeIframe() {
            iframe.style.width = window.innerWidth + "px";
            iframe.style.height = window.innerHeight + "px";
        }

        window.addEventListener("resize", resizeIframe);
        window.addEventListener("orientationchange", resizeIframe);

        resizeIframe();

        /*
         * Do not give the embedded page top-level navigation
         * or popup permissions.
         */
        iframe.addEventListener("error", function () {
            iframe.src = TRUSTED_URL;
        });
    </script>

</body>
</html>
