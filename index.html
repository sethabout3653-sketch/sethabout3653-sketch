<h1>13</h1>

<p>This page demonstrates how to block certain content using JavaScript.</p>

<div class="ads">This is an ad that will be blocked.</div>
<div id="sidebar">This is a sidebar that will be blocked.</div>
<p>This is a regular paragraph.</p>
<p>This is another paragraph that will also be blocked.</p>

<script>
// Function to block specific elements or content
function blockContent(selector) {
  const elements = document.querySelectorAll(selector);
  elements.forEach(element => {
    element.style.display = 'none'; // Hide the element
    // Or you could remove it entirely:
    // element.remove();
  });
}

// --- Usage Examples ---

// Block all elements with the class 'ads'
blockContent('.ads');

// Block an element with the ID 'sidebar'
blockContent('#sidebar');

// Block all paragraph tags
blockContent('p');

// You can add more blocking rules here as needed.
// For example, to block all images:
// blockContent('img');
</script>

</body>
