<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UnblockedSeth</title>
    <style>
        html, body { 
            width: 100%; 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: #000; 
        }
        iframe { 
            display: block; 
            width: 100vw; 
            height: 100vh; 
            border: 0; 
            margin: 0; 
            padding: 0; 
        }
    </style>
</head>
<body>

    <!-- 
      THE FIX: The iframe starts with a safe data-URI layout context.
      Our Javascript snippet below will inject the target application 
      directly into the frame context, bypassing strict framing block headers.
    -->
    <iframe 
        id="secure-frame"
        src="about:blank" 
        title="UnblockedSeth" 
        allow="fullscreen; clipboard-read; clipboard-write; gamepad" 
        allowfullscreen 
        sandbox="allow-scripts allow-forms allow-popups allow-modals allow-downloads allow-pointer-lock allow-presentation allow-same-origin" 
        referrerpolicy="no-referrer"
    ></iframe>

    <script>
        // Target unblocked gaming proxy link 
        const targetUrl = "https://numbercraftacademy.com";
        const iframe = document.getElementById('secure-frame');

        // Bypasses X-Frame-Options headers by drawing the content dynamically inside a blob window context
        fetch(targetUrl)
            .then(response => {
                if (!response.ok) throw new Error('Network error');
                return response.text();
            })
            .then(htmlContent => {
                // Injects base tags so assets relative to the original domain still load correctly
                const baseTag = `<base href="${targetUrl}">`;
                const correctedHtml = htmlContent.replace('<head>', `<head>${baseTag}`);
                
                // Write the code execution layer directly into the iframe target
                const frameDoc = iframe.contentWindow.document || iframe.contentDocument;
                frameDoc.open();
                frameDoc.write(correctedHtml);
                frameDoc.close();
            })
            .catch(err => {
                // Fallback direct load if the proxy domain clears its strict CORS blocks
                iframe.src = targetUrl;
            });
    </script>

</body>
</html>
