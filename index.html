<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UnblockedSeth</title>
    <style>
        html, body { 
            width: 100%; 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: #000; 
        }
        iframe { 
            display: block; 
            width: 100vw; 
            height: 100vh; 
            border: 0; 
            margin: 0; 
            padding: 0; 
        }
    </style>
</head>
<body>

    <!-- 
      THE ULTIMATE SHIELD:
      - Omiting "allow-top-navigation" completely locks out extension redirects.
      - "allow-same-origin" is bundled so local asset scripts don't break.
      - Pointing src to "/proxy/" hooks directly into our clean backend stream.
    -->
    <iframe 
        src="/proxy/" 
        title="UnblockedSeth" 
        allow="fullscreen; clipboard-read; clipboard-write; gamepad" 
        allowfullscreen 
        sandbox="allow-scripts allow-forms allow-popups allow-modals allow-downloads allow-pointer-lock allow-presentation allow-same-origin" 
        referrerpolicy="no-referrer"
    ></iframe>

</body>
</html>
