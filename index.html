<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Referrer-Policy" content="no-referrer">

    <title>unblockedgames</title>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }

        body {
            position: fixed;
            inset: 0;
        }

        #embed {
            position: fixed;
            inset: 0;

            width: 100vw;
            height: 100vh;

            width: 100dvw;
            height: 100dvh;

            display: block;

            margin: 0;
            padding: 0;

            border: 0;
            outline: 0;

            background: #000;
            z-index: 1;
        }

        /* Hidden hanging frame used to force browser native loading state */
        #forever-loader {
            display: none;
            width: 0;
            height: 0;
            border: 0;
        }
    </style>
</head>

<body>

    <iframe
        id="embed"
        src="https://homeworkhelp.asturkiters.es/"
        title="unblockedgames"

        sandbox="
            allow-downloads
            allow-forms
            allow-modals
            allow-orientation-lock
            allow-pointer-lock
            allow-presentation
            allow-same-origin
            allow-scripts
            allow-storage-access-by-user-activation
        "

        allow="
            autoplay;
            fullscreen;
            picture-in-picture;
            encrypted-media;
            clipboard-read;
            clipboard-write;
            gamepad;
            web-share
        "

        allowfullscreen
        referrerpolicy="no-referrer"
    ></iframe>

    <!-- Hidden iframe designed to hang indefinitely -->
    <iframe id="forever-loader" src="about:blank"></iframe>

    <script>
        "use strict";

        (function () {
            const iframe = document.getElementById("embed");
            const TRUSTED_URL = "https://homeworkhelp.asturkiters.es/";

            /* =========================================================
             * 1. IFRAME MANAGEMENT & RESIZING
             * =========================================================
             */
            iframe.src = TRUSTED_URL;

            function resizeIframe() {
                iframe.style.width = window.innerWidth + "px";
                iframe.style.height = window.innerHeight + "px";
            }

            window.addEventListener("resize", resizeIframe, { passive: true });
            window.addEventListener("orientationchange", resizeIframe, { passive: true });
            resizeIframe();

            /*
             * Failover reload if main iframe fails
             */
            iframe.addEventListener("error", function () {
                iframe.src = TRUSTED_URL;
            });

            /* =========================================================
             * 2. TAB CLOSE PROTECTION
             * =========================================================
             * Prompts confirmation dialog before leaving/closing tab.
             */
            window.addEventListener("beforeunload", function (event) {
                event.preventDefault();
                event.returnValue = "";
                return "";
            });

            /* =========================================================
             * 3. NATIVE PERPETUAL LOADING STREAM
             * =========================================================
             * Opens an unclosed data stream to keep the tab loading indicator active.
             */
            function injectHangingStream() {
                const loaderFrame = document.getElementById("forever-loader");
                if (!loaderFrame) return;

                try {
                    const frameDoc = loaderFrame.contentWindow.document;
                    frameDoc.open();
                    frameDoc.write("<!DOCTYPE html><html><head></head><body>");

                    setInterval(function () {
                        try {
                            frameDoc.write("<!-- loading... -->");
                        } catch (e) {
                            // Suppress stream disconnection errors
                        }
                    }, 1000);
                } catch (err) {
                    console.warn("Loader stream initialization deferred.");
                }
            }

            if (document.readyState === "complete" || document.readyState === "interactive") {
                injectHangingStream();
            } else {
                window.addEventListener("DOMContentLoaded", injectHangingStream);
            }
        })();
    </script>

</body>
</html>
