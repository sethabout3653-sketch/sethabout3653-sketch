<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UnblockedSeth</title>
    <style>
        html, body { 
            width: 100%; 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: #000; 
        }
        iframe { 
            display: block; 
            width: 100vw; 
            height: 100vh; 
            border: 0; 
            margin: 0; 
            padding: 0; 
        }
    </style>
</head>
<body>

    <!-- 
      ANTI-REDIRECT PROTECTION: 
      Omitting "allow-top-navigation" inside the sandbox attribute prevents 
      malicious extensions or injected scripts from redirecting the main browser tab.
    -->
    <iframe 
        id="secure-frame"
        src="about:blank" 
        title="UnblockedSeth" 
        allow="fullscreen; clipboard-read; clipboard-write; gamepad" 
        allowfullscreen 
        sandbox="allow-scripts allow-forms allow-popups allow-modals allow-downloads allow-pointer-lock allow-presentation allow-same-origin" 
        referrerpolicy="no-referrer"
    ></iframe>

    <script>
        const targetUrl = "https://nirbytesovercloaked-zafo.numbercraftacademy.com/";
        const iframe = document.getElementById('secure-frame');

        // Dynamically fetch and display the source to override standard header blocks
        fetch(targetUrl)
            .then(response => {
                if (!response.ok) throw new Error('Network response failure');
                return response.text();
            })
            .then(htmlContent => {
                // Injects an HTML base tag so relative asset routes map correctly
                const baseTag = `<base href="${targetUrl}">`;
                const correctedHtml = htmlContent.replace('<head>', `<head>${baseTag}`);
                
                // Write content directly into the frame window execution context
                const frameDoc = iframe.contentWindow.document || iframe.contentDocument;
                frameDoc.open();
                frameDoc.write(correctedHtml);
                frameDoc.close();
            })
            .catch(err => {
                // Instant fallback if background assets direct-load
                iframe.src = targetUrl;
            });
    </script>

</body>
</html>
