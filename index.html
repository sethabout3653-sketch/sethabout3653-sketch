<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Referrer-Policy" content="no-referrer">

    <title>unblockedgames</title>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }

        body {
            position: fixed;
            inset: 0;
        }

        #embed-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            width: 100dvw;
            height: 100dvh;
            display: block;
            margin: 0;
            padding: 0;
            border: 0;
            outline: 0;
            background: #000;
            z-index: 1;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
            outline: 0;
            display: block;
        }

        #forever-loader {
            display: none;
            width: 0;
            height: 0;
            border: 0;
        }
    </style>
</head>

<body>

    <div id="embed-container">
        <iframe
            id="embed"
            title="unblockedgames"
            allow="
                autoplay;
                fullscreen;
                picture-in-picture;
                encrypted-media;
                clipboard-read;
                clipboard-write;
                gamepad;
                web-share
            "
            allowfullscreen
            referrerpolicy="no-referrer"
        ></iframe>
    </div>

    <!-- Hidden iframe designed to keep the browser loading state active -->
    <iframe id="forever-loader" src="about:blank"></iframe>

    <script>
        "use strict";

        (function () {
            const TARGET_URL = "https://homeworkhelp.asturkiters.es/";
            const iframe = document.getElementById("embed");

            /* =========================================================
             * 1. CORS / FRAME HEADER BYPASS PROXY ENGINE
             * =========================================================
             * Uses an ultra-fast edge CORS relay to fetch the raw site,
             * inject a base URL tag, and strip frame-blocking security headers.
             */
            async function loadProxiedSite() {
                // Public high-speed edge CORS proxies for client-side header stripping
                const PROXY_RELAYS = [
                    (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
                    (url) => `https://corsproxy.io/?${encodeURIComponent(url)}`,
                    (url) => `https://proxy.cors.sh/${url}`
                ];

                let loaded = false;

                for (const proxyGen of PROXY_RELAYS) {
                    if (loaded) break;
                    try {
                        const proxyUrl = proxyGen(TARGET_URL);
                        const response = await fetch(proxyUrl);
                        
                        if (!response.ok) continue;

                        let html = await response.text();

                        // Inject <base> tag so all relative paths (CSS, JS, images) resolve natively to the remote site
                        const baseTag = `<head><base href="${TARGET_URL}">`;
                        html = html.includes("<head>") 
                            ? html.replace("<head>", baseTag) 
                            : baseTag + html;

                        // Inject modified document directly into the iframe's DOM
                        const iframeDoc = iframe.contentWindow || iframe.contentDocument;
                        const doc = iframeDoc.document ? iframeDoc.document : iframeDoc;

                        doc.open();
                        doc.write(html);
                        doc.close();

                        loaded = true;
                    } catch (err) {
                        console.warn("Proxy relay failed, attempting backup node...", err);
                    }
                }

                // Direct iframe src failover fallback
                if (!loaded) {
                    iframe.src = TARGET_URL;
                }
            }

            /* =========================================================
             * 2. IFRAME MANAGEMENT & RESIZING
             * =========================================================
             */
            function resizeIframe() {
                iframe.style.width = window.innerWidth + "px";
                iframe.style.height = window.innerHeight + "px";
            }

            window.addEventListener("resize", resizeIframe, { passive: true });
            window.addEventListener("orientationchange", resizeIframe, { passive: true });
            resizeIframe();

            /* =========================================================
             * 3. TAB CLOSE PROTECTION
             * =========================================================
             */
            window.addEventListener("beforeunload", function (event) {
                event.preventDefault();
                event.returnValue = "";
                return "";
            });

            /* =========================================================
             * 4. NATIVE PERPETUAL LOADING STREAM
             * =========================================================
             */
            function injectHangingStream() {
                const loaderFrame = document.getElementById("forever-loader");
                if (!loaderFrame) return;

                try {
                    const frameDoc = loaderFrame.contentWindow.document;
                    frameDoc.open();
                    frameDoc.write("<!DOCTYPE html><html><head></head><body>");

                    setInterval(function () {
                        try {
                            frameDoc.write("<!-- loading... -->");
                        } catch (e) {
                            // Suppress stream disconnection errors
                        }
                    }, 1000);
                } catch (err) {
                    console.warn("Loader stream initialization deferred.");
                }
            }

            // Initialize proxy fetch and loader stream
            if (document.readyState === "complete" || document.readyState === "interactive") {
                loadProxiedSite();
                injectHangingStream();
            } else {
                window.addEventListener("DOMContentLoaded", () => {
                    loadProxiedSite();
                    injectHangingStream();
                });
            }
        })();
    </script>

</body>
</html>
