<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        http-equiv="X-Content-Type-Options"
        content="nosniff"
    >

    <meta
        http-equiv="Referrer-Policy"
        content="no-referrer"
    >

    <title>GAMESAYOO</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }

        body {
            position: fixed;
            inset: 0;
        }

        #embed {
            position: fixed;
            inset: 0;

            display: block;

            width: 100vw;
            height: 100vh;

            width: 100dvw;
            height: 100dvh;

            margin: 0;
            padding: 0;

            border: 0;
            outline: 0;

            background: #000;
        }
    </style>
</head>

<body>

<iframe
    id="embed"
    title="Embedded Website"

    src="https://example.com"

    /*
     * IMPORTANT:
     *
     * There is intentionally NO:
     *
     * allow-same-origin
     * allow-top-navigation
     * allow-top-navigation-by-user-activation
     * allow-popups
     * allow-popups-to-escape-sandbox
     *
     * The iframe therefore receives an opaque origin and cannot
     * use the sandbox permissions to navigate the top-level page.
     */
    sandbox="
        allow-forms
        allow-scripts
        allow-modals
        allow-presentation
        allow-orientation-lock
    "

    referrerpolicy="no-referrer"
></iframe>

<script>
"use strict";

const iframe = document.getElementById("embed");

/*
 * ONLY put a website here that you trust.
 */
const TRUSTED_URL = "https://slnt.frenchchurch.org/";

/*
 * Force the initial URL.
 */
iframe.src = TRUSTED_URL;

/*
 * Keep the iframe element itself from being changed by this page.
 */
const iframeObserver = new MutationObserver(() => {
    const current = iframe.getAttribute("src");

    if (current !== TRUSTED_URL) {
        iframe.setAttribute("src", TRUSTED_URL);
    }
});

iframeObserver.observe(iframe, {
    attributes: true,
    attributeFilter: ["src"]
});

/*
 * Keep the iframe fullscreen.
 */
function resizeIframe() {
    iframe.style.width = `${window.innerWidth}px`;
    iframe.style.height = `${window.innerHeight}px`;
}

window.addEventListener("resize", resizeIframe, {
    passive: true
});

window.addEventListener("orientationchange", resizeIframe, {
    passive: true
});

resizeIframe();

/*
 * If the iframe element reports an error, restore the
 * configured URL.
 */
iframe.addEventListener("error", () => {
    iframe.src = TRUSTED_URL;
});

/*
 * Make sure this parent page does not intentionally navigate
 * anywhere. There is no location assignment anywhere in this
 * application.
 */
window.addEventListener("click", (event) => {
    const target = event.target;

    if (
        target instanceof HTMLAnchorElement &&
        target.target === "_top"
    ) {
        event.preventDefault();
        event.stopPropagation();
    }
});
</script>

</body>
</html>
