<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Website</title>
    <style>
        body { margin: 0; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f0f0; }
        .fullscreen-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        iframe {
            border: none; /* Remove default iframe border */
            width: 100%;
            height: 100%;
            display: block; /* Removes extra space below the iframe */
        }
    </style>
</head>
<body>
    <div class="fullscreen-container">
        <iframe
            src="YOUR_TARGET_WEBSITE_URL_HERE"
            sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-downloads"
            allowfullscreen
            title="Embedded Content"
        ></iframe>
    </div>
</body>
</html>
