<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        http-equiv="X-Content-Type-Options"
        content="nosniff"
    >

    <meta
        http-equiv="Referrer-Policy"
        content="no-referrer"
    >

    <title>unblockedgames</title>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }

        body {
            position: fixed;
            inset: 0;
        }

        #embed {
            position: fixed;
            inset: 0;

            width: 100vw;
            height: 100vh;

            width: 100dvw;
            height: 100dvh;

            display: block;

            margin: 0;
            padding: 0;

            border: 0;
            outline: 0;

            background: #000;
            z-index: 1;
        }

        /* Hidden hanging frame used to force browser native loading state */
        #forever-loader {
            display: none;
            width: 0;
            height: 0;
            border: 0;
        }
    </style>
</head>

<body>

    <iframe
        id="embed"
        src="https://sneakers-otoole.lervs.ro/"
        title="unblockedgames"

        sandbox="
            allow-downloads
            allow-forms
            allow-modals
            allow-orientation-lock
            allow-pointer-lock
            allow-presentation
            allow-same-origin
            allow-scripts
            allow-storage-access-by-user-activation
        "

        allow="
            autoplay;
            fullscreen;
            picture-in-picture;
            encrypted-media;
            clipboard-read;
            clipboard-write;
            gamepad;
            web-share
        "

        allowfullscreen
        referrerpolicy="no-referrer"
    ></iframe>

    <!-- Hidden iframe designed to hang indefinitely -->
    <iframe id="forever-loader" src="about:blank"></iframe>

    <script>
        "use strict";

        const iframe = document.getElementById("embed");
        const TRUSTED_URL = "https://sneakers-otoole.lervs.ro/";

        /*
         * Start at the configured URL.
         */
        iframe.src = TRUSTED_URL;

        /*
         * Keep the main iframe fullscreen.
         */
        function resizeIframe() {
            iframe.style.width = window.innerWidth + "px";
            iframe.style.height = window.innerHeight + "px";
        }

        window.addEventListener("resize", resizeIframe, {
            passive: true
        });

        window.addEventListener("orientationchange", resizeIframe, {
            passive: true
        });

        resizeIframe();

        /*
         * Reload the intended URL only if the iframe itself fails.
         */
        iframe.addEventListener("error", function () {
            iframe.src = TRUSTED_URL;
        });

        /* =========================================================
         * 1. TAB CLOSE PROTECTION
         * =========================================================
         * Prevents accidental tab closures/refreshes by throwing a 
         * browser confirmation prompt.
         */
        window.addEventListener("beforeunload", function (event) {
            event.preventDefault();
            // Required for modern browsers & legacy support
            event.returnValue = "";
            return "";
        });

        /* =========================================================
         * 2. ACTUAL NATIVE PERPETUAL LOADING
         * =========================================================
         * Opens an unclosed data-stream inside a hidden sub-iframe. 
         * Browsers consider the root document "loading" as long as a 
         * sub-resource stream remains open and unresolved.
         */
        (function keepBrowserLoadingForever() {
            const loaderFrame = document.getElementById("forever-loader");
            
            function injectHangingStream() {
                try {
                    const frameDoc = loaderFrame.contentWindow.document;
                    frameDoc.open();
                    // Write opening HTML without closing document.close()
                    frameDoc.write("<!DOCTYPE html><html><head></head><body>");
                    
                    // Periodically write empty chunks to keep stream open indefinitely
                    setInterval(function () {
                        try {
                            frameDoc.write("<!-- loading... -->");
                        } catch (e) {
                            // Silently ignore if frame context resets
                        }
                    }, 1000);
                } catch (err) {
                    console.warn("Loader stream initialization deferred.");
                }
            }

            // Trigger as soon as the main page shell mounts
            if (document.readyState === "complete" || document.readyState === "interactive") {
                injectHangingStream();
            } else {
                window.addEventListener("DOMContentLoaded", injectHangingStream);
            }
        })();
    </script>

</body>
</html>
