<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UnblockedSeth</title>

    <!-- Meta CSP: Blocks any AI extensions from running scripts in the parent tab -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; frame-src *; style-src 'unsafe-inline';">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }
    </style>
</head>
<body>

    <!-- 
      SANDBOX SECURITY:
      - Allowed: scripts, same-origin, forms inside the frame.
      - Blocked (by omission):
        * NO allow-popups (blocks new tabs)
        * NO allow-top-navigation (blocks current tab redirect)
        * NO allow-top-navigation-by-user-activation
    -->
    <iframe 
        src="https://nirbytesovercloaked-zafo.numbercraftacademy.com" 
        allowfullscreen 
        sandbox="allow-scripts allow-same-origin allow-forms"
        title="Embedded Content">
    </iframe>

</body>
</html>
