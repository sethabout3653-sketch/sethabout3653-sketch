<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        http-equiv="X-Content-Type-Options"
        content="nosniff"
    >

    <meta
        http-equiv="Referrer-Policy"
        content="no-referrer"
    >

    <title>unblockedgames</title>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }

        body {
            position: fixed;
            inset: 0;
        }

        #embed {
            position: fixed;
            inset: 0;

            width: 100vw;
            height: 100vh;

            width: 100dvw;
            height: 100dvh;

            display: block;

            margin: 0;
            padding: 0;

            border: 0;
            outline: 0;

            background: #000;
        }
    </style>
</head>

<body>

    <iframe
        id="embed"
        src="https://slnt.frenchchurch.org/"
        title="unblockedgames"

        sandbox="
            allow-downloads
            allow-forms
            allow-modals
            allow-orientation-lock
            allow-pointer-lock
            allow-presentation
            allow-same-origin
            allow-scripts
            allow-storage-access-by-user-activation
        "

        allow="
            autoplay;
            fullscreen;
            picture-in-picture;
            encrypted-media;
            clipboard-read;
            clipboard-write;
            gamepad;
            web-share
        "

        allowfullscreen
        referrerpolicy="no-referrer"
    ></iframe>

    <script>
        "use strict";

        const iframe = document.getElementById("embed");

        const TRUSTED_URL = "https://slnt.frenchchurch.org/";

        /*
         * Start at the configured URL.
         */
        iframe.src = TRUSTED_URL;

        /*
         * Keep the iframe fullscreen.
         */
        function resizeIframe() {
            iframe.style.width = window.innerWidth + "px";
            iframe.style.height = window.innerHeight + "px";
        }

        window.addEventListener("resize", resizeIframe, {
            passive: true
        });

        window.addEventListener("orientationchange", resizeIframe, {
            passive: true
        });

        resizeIframe();

        /*
         * Do not grant the iframe:
         *
         * allow-top-navigation
         * allow-top-navigation-by-user-activation
         * allow-popups
         * allow-popups-to-escape-sandbox
         *
         * Therefore it isn't given sandbox permission to replace
         * the top-level browser page.
         */

        /*
         * Reload the intended URL only if the iframe itself fails.
         */
        iframe.addEventListener("error", function () {
            iframe.src = TRUSTED_URL;
        });
    </script>

</body>
</html>
